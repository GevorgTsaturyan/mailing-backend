# HTTP server block — provisioned by scripts/provision-identity-hosts.sh
# certbot --nginx will add the HTTPS block and HTTP→HTTPS redirect on first run.
# Do not edit this file manually after certbot has run; re-run the script instead.
server {
    listen 80;
    server_name __SUBDOMAIN__;

    location / {
        proxy_pass         http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
